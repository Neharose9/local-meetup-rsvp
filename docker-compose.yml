services:

  mysql:
    image: mysql:8.0
    container_name: meetup-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: meetup_db

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    build:
      context: ./backend

    container_name: meetup-backend
    restart: unless-stopped

    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: meetup_db
      DB_PORT: 3306
      JWT_SECRET: meetup_rsvp_super_secret_key_change_this

    ports:
      - "5000:5000"

    depends_on:
      mysql:
        condition: service_healthy


  frontend:
    build:
      context: ./frontend

    container_name: meetup-frontend
    restart: unless-stopped

    ports:
      - "3000:3000"

    depends_on:
      - backend


volumes:
  mysql_data: